<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="lib/p5.js"></script>
    <script src="lib/p5.sound.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />
  </head>
  <body>
    <main>
    </main>

    <!-- 화면 왼쪽 아래에 고정되는 버튼 영역 -->
    <div class="controls">
      <!-- RESET: 쌓인 비둘기를 지우고 처음부터 다시 시작 -->
      <button id="reset">RESET</button>

      <div class="more-row">
        <!-- MORE: 슬라이더에 정한 수만큼 나는 비둘기를 추가 -->
        <button id="more">MORE</button>

        <!-- 다음 MORE 때 추가할 비둘기 수를 정하는 슬라이더 -->
        <div class="slider-wrap">
          <input id="moreCount" type="range" min="1" max="40" value="20">
          <span id="moreCountValue">20</span>
        </div>
      </div>
    </div>

    <script src="Particle.js"></script>
    <script src="ParticleSystem.js"></script>
    <script src="sketch.js"></script>

    <h1> My Party System</h1>
    <p class="intro">
      My Party System은 p5.js로 만든 파티클 시스템 예제입니다.
      캔버스 위쪽에서 끊임없이 생겨난 입자들이 중력을 받아 떨어지며 서서히 사라집니다.
      디아프 수업 연습용으로 만들었습니다.
    </p>
  </body>
</html>
